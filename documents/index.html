alse,\n    \"message\": \"Anda sudah memiliki tiket permohonan yang sedang diproses. Mohon tunggu review administrator.\",\n    \"ticket_number\": \"TKT-AB82C71E\"\n}\n```\n\n---\n\n## 2. Cek Status Tiket Banding (Check Ticket Status)\n\nMelihat status permohonan banding menggunakan nomor tiket unik.\n\n- **Metode**: `GET`\n- **URI**: `\/api\/security\/unblock-tickets\/check\/{ticketNumber}`\n- **Headers**:\n    - `Accept: application\/json`\n\n### Contoh Request:\n\n```bash\ncurl -X GET \"https:\/\/domain-anda.com\/api\/security\/unblock-tickets\/check\/TKT-AB82C71E\"\n```\n\n### Contoh Respons Berhasil (HTTP 200):\n\n```json\n{\n    \"success\": true,\n    \"data\": {\n        \"ticket_number\": \"TKT-AB82C71E\",\n        \"status\": \"approved\",\n        \"created_at\": \"2026-10-02T00:20:00.000000Z\",\n        \"resolved_at\": \"2026-10-02T00:35:10.000000Z\",\n        \"admin_notes\": \"Identitas staf terverifikasi, blokir perangkat telah dicabut.\"\n    }\n}\n```\n\n### Nilai Status Kemungkinan:\n\n- `pending`: Tiket baru masuk dan belum diperiksa administrator.\n- `approved`: Permohonan disetujui, blokir pada IP\/perangkat telah dicabut.\n- `rejected`: Permohonan ditolak oleh administrator, blokir tetap dipertahankan.\n"},{"section":"04-rest-api-reference","filename":"03-user-endpoints.md","title":"03. Endpoint Pengguna Terautentikasi","content":"# 03. Endpoint Pengguna Terautentikasi\n\nEndpoint pada bagian ini mewajibkan pengguna telah melakukan autentikasi (`auth` middleware) melalui sesi cookie web (Laravel Sanctum\/Breeze) atau Bearer token.\n\n---\n\n## 1. Simpan IP Saya sebagai IP Terpercaya (Save My IP)\n\nMemungkinkan pengguna yang sedang login untuk mendaftarkan alamat IP dan perangkat yang sedang mereka gunakan ke dalam daftar `trusted_ips` milik mereka.\n\n- **Metode**: `POST`\n- **URI**: `\/api\/security\/trusted-ips\/save-my-ip`\n- **Headers**:\n  - `Authorization: Bearer <user-token>`\n  - `Content-Type: application\/json`\n  - `Accept: application\/json`\n  - `X-Device-Id`: *Opsional, UUID fingerprint perangkat*\n  - `X-Local-Ip`: *Opsional, IP LAN lokal*\n- **Body JSON**:\n  ```json\n  {\n      \"device_name\": \"MacBook Pro M3 Kantor\"\n  }\n  ```\n\n### Contoh Request cURL:\n```bash\ncurl -X POST \"https:\/\/domain-anda.com\/api\/security\/trusted-ips\/save-my-ip\" \\\n     -H \"Authorization: Bearer 1|abc123xyz...\" \\\n     -H \"Content-Type: application\/json\" \\\n     -H \"Accept: application\/json\" \\\n     -d '{\"device_name\": \"Laptop Kerja Utama\"}'\n```\n\n### Contoh Respons Berhasil (HTTP 200 OK):\n```json\n{\n    \"success\": true,\n    \"message\": \"IP 103.11.22.45 berhasil ditambahkan sebagai IP terpercaya Anda.\",\n    \"data\": {\n        \"id\": 8,\n        \"user_id\": 4,\n        \"ip_address\": \"103.11.22.45\",\n        \"local_ip\": \"192.168.1.15\",\n        \"device_id\": \"dev-uuid-001\",\n        \"device_name\": \"Laptop Kerja Utama\",\n        \"operating_system\": \"Mozilla\/5.0 (Macintosh; Intel Mac OS X 10_15_7)...\",\n        \"is_active\": true,\n        \"verified_at\": \"2026-10-02T00:30:00.000000Z\"\n    }\n}\n```\n\n---\n\n## 2. Manfaat & Penggunaan di Aplikasi Host\n\nSetelah IP terdaftar di tabel `trusted_ips`:\n1. Aplikasi host dapat memeriksa keterpercayaan IP melalui relasi Eloquent atau service:\n   ```php\n   use Internal\\SecurityMonitor\\Services\\UserLoginService;\n\n   $isTrusted = app(UserLoginService::class)->isIpTrusted(\n       ip: $request->ip(),\n       userId: $user->id,\n       deviceId: $request->header('X-Device-Id')\n   );\n   ```\n2. Melewati kewajiban tantangan Two-Factor Authentication (2FA) berulang pada perangkat yang sama.\n3. Memberikan alert keamanan lewat email jika terjadi login dari perangkat asing yang belum terdaftar.\r\n"},{"section":"04-rest-api-reference","filename":"04-admin-endpoints.md","title":"04. Endpoint Administrator REST API","content":"# 04. Endpoint Administrator REST API\n\nSeluruh endpoint pada dokumen ini dilindungi oleh middleware ganda: **`auth`** (pengguna harus login) dan **`security.admin`** (`EnsureSecurityAdmin`).\n\n---\n\n## 1. Log Keamanan (Security Logs)\n\n### A. Ambil Daftar Log Keamanan (Index & Statistik)\nMengambil data log terpaginasi lengkap dengan rincian statistik, level breakdown, top attacker, dan tren ancaman.\n\n- **Metode**: `GET`\n- **URI**: `\/api\/security\/logs`\n- **Query Parameters**:\n  - `page` *(int)*: Nomor halaman (default: 1).\n  - `per_page` *(int)*: Jumlah per halaman (default: 25, maks: 100).\n  - `search` *(string)*: Cari berdasarkan IP, path, evidence, rule label, atau user agent.\n  - `level` *(string)*: Filter tingkat ancaman (`low`, `medium`, `high`, `critical`).\n  - `event_type` *(string)*: Filter jenis event (`threat_detected`, `blocked_attempt`, dll).\n  - `was_blocked` *(bool)*: Filter apakah request berujung blokir (`true` atau `false`).\n  - `range` *(string)*: Rentang agregasi grafik tren (`week`, `month`, `year`).\n\n#### Contoh Respons Berhasil (HTTP 200):\n```json\n{\n    \"success\": true,\n    \"data\": {\n        \"current_page\": 1,\n        \"data\": [\n            {\n                \"id\": 142,\n                \"event_type\": \"threat_detected\",\n                \"threat_level\": \"critical\",\n                \"rule_id\": \"ssti\",\n                \"rule_label\": \"Percobaan Server-Side Template Injection (SSTI)\",\n                \"ip_address\": \"198.51.100.77\",\n                \"device_id\": \"dev-01\",\n                \"method\": \"GET\",\n                \"path\": \"\/search\",\n                \"query_string\": \"q=%7B%7B7*7%7D%7D\",\n                \"evidence\": \"q={{7*7}}\",\n                \"was_blocked\": true,\n                \"action_taken\": \"instant_block\",\n                \"created_at\": \"2026-10-02T00:25:00.000000Z\"\n            }\n        ],\n        \"total\": 142\n    },\n    \"stats\": {\n        \"total_threats\": 142,\n        \"blocked_threats\": 89,\n        \"critical_threats\": 34\n    },\n    \"level_breakdown\": {\n        \"critical\": 34,\n        \"high\": 45,\n        \"medium\": 50,\n        \"low\": 13\n    },\n    \"top_attackers\": [\n        { \"ip_address\": \"198.51.100.77\", \"hits\": 24 }\n    ],\n    \"trend\": [\n        { \"date\": \"2026-09-25\", \"count\": 12 },\n        { \"date\": \"2026-09-26\", \"count\": 19 }\n    ]\n}\n```\n\n### B. Bersihkan Seluruh Log (Clear All Logs)\n- **Metode**: `DELETE`\n- **URI**: `\/api\/security\/logs\/clear`\n\n---\n\n## 2. Pengelolaan Karantina IP (Blocked IPs)\n\n### A. Ambil Daftar IP yang Diblokir\n- **Metode**: `GET`\n- **URI**: `\/api\/security\/blocked-ips`\n- **Query Parameters**:\n  - `search` *(string)*: Cari IP, device ID, catatan, atau alasan.\n  - `status` *(string)*: `active`, `expired`, atau `permanent`.\n  - `per_page` *(int)*: Jumlah per halaman (maks: 100).\n\n### B. Blokir IP \/ Perangkat Baru Secara Manual\n- **Metode**: `POST`\n- **URI**: `\/api\/security\/blocked-ips`\n- **Body JSON**:\n  ```json\n  {\n      \"ip_address\": \"203.0.113.50\",\n      \"device_id\": \"device-uuid-optional\",\n      \"local_ip\": \"192.168.1.55\",\n      \"block_scope\": \"ip\",\n      \"reason\": \"Scanning celah direktori admin berulang kali\",\n      \"notes\": \"Tiket insiden #SEC-8812\",\n      \"duration_hours\": 48,\n      \"is_permanent\": false\n  }\n  ```\n- **Validasi Khusus**:\n  - Tidak dapat memblokir IP sendiri (`resolveClientIp`).\n  - Tidak dapat memblokir IP yang berada dalam whitelist.\n\n### C. Detail Blokir IP Beserta Log Terkait\n- **Metode**: `GET`\n- **URI**: `\/api\/security\/blocked-ips\/{id}`\n- Mengembalikan entri `BlockedIp` beserta 20 entri `SecurityLog` terakhir dari IP tersebut.\n\n### D. Beralih Status Aktif\/Nonaktif (Toggle)\n- **Metode**: `PATCH`\n- **URI**: `\/api\/security\/blocked-ips\/{id}\/toggle`\n\n### E. Hapus Blokir (Unblock)\n- **Metode**: `DELETE`\n- **URI**: `\/api\/security\/blocked-ips\/{id}`\n\n---\n\n## 3. Audit Server & Baseline Integritas\n\n### A. Ambil Laporan Audit Server\n- **Metode**: `GET`\n- **URI**: `\/api\/security\/server?refresh=true`\n- **Informasi yang Dikembalikan**:\n  - `environment`: Status `APP_DEBUG`, HTTPS enforcement, session secure cookie, disk free space %.\n  - `integrity`: Laporan baseline SHA-256 (berkas dimodifikasi, hilang, atau baru).\n  - `suspicious_files`: Daftar berkas berbahaya (webshell, skrip PHP di folder public\/storage).\n  - `scheduler`: Status heartbeat cron Laravel.\n  - `lockouts`: Daftar akun yang sedang terkunci akibat kegagalan login.\n\n### B. Buat Baseline Integritas Baru (SHA-256)\n- **Metode**: `POST`\n- **URI**: `\/api\/security\/server\/baseline`\n\n### C. Hapus Baseline Integritas\n- **Metode**: `DELETE`\n- **URI**: `\/api\/security\/server\/baseline`\n\n### D. Hapus Berkas Mencurigakan (Safe Deletion)\n- **Metode**: `DELETE`\n- **URI**: `\/api\/security\/server\/suspicious-files`\n- **Body JSON**:\n  ```json\n  {\n      \"file_path\": \"public\/uploads\/shell.php\"\n  }\n  ```\n- **Proteksi**: Menolak path traversal (`..`), menolak penghapusan berkas di luar `base_path()`, dan melindungi berkas vital (`public\/index.php`, `.env`, dll).\n\n### E. Lepaskan Lockout Login Pengguna\n- **Metode**: `DELETE`\n- **URI**: `\/api\/security\/lockouts\/{id}`\n\n---\n\n## 4. Sesi Pengguna & IP Terpercaya (User Sessions)\n\n### A. Daftar Sesi Pengguna & Online Count\n- **Metode**: `GET`\n- **URI**: `\/api\/security\/user-sessions`\n- Mengembalikan riwayat login pengguna (`logins`), daftar `trusted_ips`, dan jumlah pengguna aktif saat ini (`online_count`).\n\n### B. Pemantauan Realtime Pengguna Aktif\n- **Metode**: `GET`\n- **URI**: `\/api\/security\/user-sessions\/realtime`\n\n### C. Putus Paksa Sesi Pengguna (Force Logout)\n- **Metode**: `DELETE`\n- **URI**: `\/api\/security\/user-sessions\/session\/{sessionId}`\n\n### D. Hapus IP Terpercaya\n- **Metode**: `DELETE`\n- **URI**: `\/api\/security\/trusted-ips\/{id}`\n\n---\n\n## 5. Manajemen Tiket Banding (Appeal Tickets)\n\n### A. Daftar Tiket Banding\n- **Metode**: `GET`\n- **URI**: `\/api\/security\/unblock-tickets?status=pending`\n\n### B. Tanggapi Tiket (Approve \/ Reject)\n- **Metode**: `POST`\n- **URI**: `\/api\/security\/unblock-tickets\/{id}\/respond`\n- **Body JSON**:\n  ```json\n  {\n      \"action\": \"approve\",\n      \"admin_notes\": \"Blokir dibuka setelah validasi identitas via WhatsApp dinas.\"\n  }\n  ```\n- **Aksi Otomatis**: Jika `action` adalah `approve`, sistem langsung memanggil `unblockIp()` untuk membuka karantina pada IP\/perangkat terkait.\n\n### C. Hapus Arsip Tiket\n- **Metode**: `DELETE`\n- **URI**: `\/api\/security\/unblock-tickets\/{id}`\r\n"},{"section":"05-cli-and-automation","filename":"01-artisan-commands.md","title":"01. Referensi Perintah Artisan CLI","content":"# 01. Referensi Perintah Artisan CLI\n\nPaket menyertakan kumpulan perintah Artisan CLI untuk administrasi, otomasi pemindaian, dan pemeliharaan server secara mandiri.\n\n---\n\n## 1. `security:install`\n\nMenginisialisasi paket, mempublikasikan konfigurasi, migrasi database, konfigurasi Nginx hardened WAF, serta menerapkan aturan **Apache `.htaccess` Hardened** di folder `public\/`.\n\n```bash\nphp artisan security:install [options]\n```\n\n### Mekanisme Pembaruan `.htaccess`:\n\n- Jika `public\/.htaccess` belum ada: installer membuat berkas baru dengan rewrite standar Laravel + blok proteksi hardening.\n- Jika `public\/.htaccess` sudah ada: installer membuat berkas backup otomatis (`.htaccess.backup-YYYYMMDD_HHMMSS`) dan menambahkan blok hardening keamanan di bagian bawah berkas tanpa merusak aturan kustom pengguna.\n- Jika sudah terpasang: installer mendeteksi signature hardening dan tidak menduplikasi aturan.\n\n### Mekanisme Penyematan Variabel `.env` & `.env.example`:\n\n- Installer secara otomatis memeriksa apakah blok konfigurasi `SECURITY_*` sudah ada di `.env` dan `.env.example`.\n- Jika belum ada, installer menyematkan blok variabel lingkungan lengkap dengan komentar dokumentasi berbahasa Indonesia di akhir berkas.\n- Opsi `--without-env` dapat digunakan untuk melewati langkah ini jika Anda ingin mengonfigurasi variabel lingkungan secara manual.\n\n### Opsi:\n\n- `--force`: Menimpa seluruh berkas konfigurasi, migrasi, `nginx.conf`, dan `public\/.htaccess` dengan template bawaan.\n- `--without-nginx`: Melewatkan publikasi berkas `nginx.conf`.\n- `--without-htaccess`: Melewatkan publikasi atau penambahan aturan pada `public\/.htaccess`.\n- `--with-htaccess`: Memaksa pembaruan berkas `public\/.htaccess` dengan aturan hardening keamanan.\n- `--without-env`: Melewatkan penyematan variabel konfigurasi ke berkas `.env` dan `.env.example`.\n\n---\n\n## 2. `security:scan-logs`\n\nMemindai berkas log web server (Apache\/Nginx) secara streaming, mendeteksi serangan yang ditolak di level web server, mengimpor ke tabel log keamanan, atau langsung memblokir IP penyerang zero-tolerance.\n\n```bash\nphp artisan security:scan-logs [options]\n```\n\n### Opsi:\n\n- `--file=*`: Berkas log yang diperiksa (dapat ditentukan lebih dari satu kali, misal: `--file=\/var\/log\/nginx\/access.log --file=\/var\/log\/nginx\/access.log.1`).\n- `--ip=`: Memfilter analisis hanya untuk satu alamat IP penyerang tertentu.\n- `--since=`: Membatasi baris sejak waktu tertentu (misal: `\"2 days ago\"` atau `\"2026-10-01 00:00\"`).\n- `--until=`: Membatasi baris hingga waktu tertentu.\n- `--min-level=`: Saring level ancaman minimal (`low`, `medium`, `high`, `critical`).\n- `--top=20`: Jumlah IP penyerang teratas yang ditampilkan di tabel ringkasan.\n- `--samples`: Menampilkan contoh URI request yang mencurigakan untuk setiap IP.\n- `--json`: Mengeluarkan hasil analisis dalam format JSON murni (cocok untuk pipeline SIEM \/ alerting).\n- `--import`: Menyimpan temuan ke tabel database `security_logs`.\n- `--block`: Memblokir otomatis IP yang memicu signature zero-tolerance.\n- `--dry-run`: Mode simulasi: menampilkan apa saja yang akan diblokir\/diimpor tanpa mengubah data apa pun di database.\n\n### Contoh Skenario:\n\n```bash\n# 1. Analisis cepat 24 jam terakhir tanpa ubah database\nphp artisan security:scan-logs --since=\"24 hours ago\" --samples\n\n# 2. Tangkap penyerang dan blokir langsung di database\nphp artisan security:scan-logs --since=\"6 hours ago\" --import --block\n```\n\n---\n\n## 3. `security:baseline`\n\nMembuat, mengaudit, atau menghapus baseline hash SHA-256 integritas berkas aplikasi.\n\n```bash\nphp artisan security:baseline [options]\n```\n\n### Opsi:\n\n- _(tanpa opsi)_: Membuat baseline baru jika belum ada, atau menampilkan ringkasan baseline yang tersimpan.\n- `--check`: Membandingkan kondisi berkas saat ini dengan baseline tanpa menulis apa pun ke disk (mode audit).\n- `--prune`: Menghapus berkas baseline yang tersimpan di `storage\/app\/security-baseline.json`.\n- `--force`: Membuat baseline baru dan menimpa baseline lama tanpa meminta konfirmasi interaktif.\n\n### Contoh Output Audit:\n\n```text\nBaseline SHA-256 dibuat: 2026-10-01 10:00:00 (1.420 berkas)\nStatus Audit:\n  - Berkas dimodifikasi : 0\n  - Berkas hilang       : 0\n  - Berkas baru         : 1 (public\/uploads\/backdoor.php) [PERINGATAN!]\n```\n\n---\n\n## 4. `security:unblock-ip`\n\nMembuka blokir alamat IP yang terkena karantina WAF. Berfungsi sebagai **Escape Hatch** darurat jika administrator tidak sengaja memblokir IP mereka sendiri.\n\n```bash\nphp artisan security:unblock-ip [ip] [options]\n```\n\n### Argumen & Opsi:\n\n- `ip`: Alamat IP yang ingin dibuka blokirnya (misal: `198.51.100.50`).\n- `--all`: Membuka blokir seluruh IP yang sedang aktif sekaligus.\n- `--list`: Menampilkan daftar seluruh IP yang sedang diblokir aktif saat ini.\n\n### Contoh:\n\n```bash\n# Buka blokir satu IP\nphp artisan security:unblock-ip 198.51.100.50\n\n# Lihat siapa saja yang sedang diblokir\nphp artisan security:unblock-ip --list\n\n# Buka seluruh blokir saat insiden darurat\nphp artisan security:unblock-ip --all\n```\n\n---\n\n## 5. `security:prune-logs`\n\nMembersihkan riwayat log keamanan yang telah melewati batas retensi waktu.\n\n```bash\nphp artisan security:prune-logs [options]\n```\n\n### Opsi:\n\n- `--days=`: Mengesampingkan konfigurasi retensi hari (default: `SECURITY_LOG_RETENTION_DAYS`, biasanya 90 hari).\n\n### Contoh:\n\n```bash\n# Bersihkan log yang lebih tua dari 30 hari\nphp artisan security:prune-logs --days=30\n```\n\n---\n\n## 6. `security:purge-injected-data`\n\nMendeteksi dan menghapus residu payload pentest atau injeksi yang tersimpan di dalam tabel aplikasi (misal `{{7*7}}`, `.htaccess`, `..\/..\/..\/public\/`).\n\n```bash\nphp artisan security:purge-injected-data [options]\n```\n\n### Opsi:\n\n- _(tanpa `--force`)_: Menjalankan mode simulasi (hanya mendeteksi dan menampilkan daftar baris data yang tercemar tanpa menghapusnya).\n- `--force`: Menghapus baris data tercemar yang ditemukan.\n- `--marker=*`: Marker teks spesifik yang dicari (dapat diulang, default: canary pentest umum).\n- `--model=*`: Membatasi pencarian pada model Eloquent tertentu.\n"},{"section":"05-cli-and-automation","filename":"02-scheduled-tasks.md","title":"02. Tugas Terjadwal (Cron & Scheduler)","content":"# 02. Tugas Terjadwal (Cron & Scheduler)\n\n`SecurityMonitorServiceProvider` menyertakan registrasi otomatis ke sistem scheduler bawaan Laravel (`Illuminate\\Console\\Scheduling\\Schedule`). Tugas-tugas ini beroperasi secara otonom di latar belakang untuk menjaga higienitas basis data dan integritas server.\n\n---\n\n## 1. Tugas Terjadwal Bawaan\n\nJika `SECURITY_SCHEDULE_ENABLED=true` (default), tugas berikut otomatis aktif:\n\n### A. Pembersihan Log Kedaluwarsa Harian (`security:prune-logs`)\n- **Jadwal**: Harian pada jam yang ditentukan oleh `SECURITY_PRUNE_SCHEDULE` (default: **02:30 pagi**).\n- **Aksi**: Menghapus entri `security_logs` yang lebih tua dari `SECURITY_LOG_RETENTION_DAYS` (default: 90 hari) agar ukuran database tidak membengkak seiring waktu.\n\n### B. Scheduler Heartbeat (`security-heartbeat`)\n- **Jadwal**: Setiap menit (`everyMinute()`).\n- **Aksi**: Menuliskan stempel waktu ISO-8601 ke cache dengan key `ServerSecurityService::HEARTBEAT_KEY`.\n- **Fungsi**: Laporan audit server (`\/api\/security\/server`) menggunakan heartbeat ini untuk mendeteksi apakah cron server Anda berjalan normal atau mati\/macet.\n\n### C. Pemindaian Log Akses Web Server Otomatis\n- **Jadwal**: Harian pada pukul **03:00 pagi**.\n- **Aktivasi**: Aktif jika `SECURITY_ACCESS_LOG_AUTO_SCAN=true`.\n- **Aksi**: Menjalankan:\n  ```bash\n  php artisan security:scan-logs --import --min-level=high --since=\"24 hours ago\"\n  ```\n  Menyerap seluruh temuan ancaman dari log web server ke basis data audit keamanan.\n\n---\n\n## 2. Mengonfigurasi Crontab Server Produksi\n\nAgar tugas terjadwal Laravel dapat berjalan, pastikan baris cron Laravel telah terpasang di server Anda:\n\nBuka crontab pengguna web (misal `www-data` atau `cpanel`):\n```bash\ncrontab -e\n```\n\nTambahkan baris berikut:\n```cron\n* * * * * cd \/var\/www\/aplikasi-anda && php artisan schedule:run >> \/dev\/null 2>&1\n```\n\n---\n\n## 3. Menjalankan Scheduler Secara Lokal \/ Docker\n\nUntuk menguji tugas terjadwal di lingkungan pengembangan lokal:\n```bash\nphp artisan schedule:work\n```\nPerintah ini akan menjalankan scheduler di latar belakang setiap 60 detik tanpa perlu mengatur crontab sistem operasi.\r\n"},{"section":"06-webserver-hardening","filename":"01-nginx-hardened-waf.md","title":"01. Konfigurasi Nginx Hardened WAF (`nginx.conf`)","content":"# 01. Konfigurasi Nginx Hardened WAF (`nginx.conf`)\n\nKeamanan sebuah aplikasi web harus menerapkan prinsip **Pertahanan Berlapis (Defense in Depth)**. WAF di tingkat aplikasi PHP sangat kuat dalam memahami logika bisnis, namun penyerang dapat menghabiskan sumber daya CPU server sebelum request sempat diproses oleh PHP.\n\nPaket ini menyertakan template konfigurasi Nginx siap pakai (`stubs\/nginx.conf.stub` atau dipublikasikan melalui `php artisan security:install`), yang dirancang khusus untuk memblokir serangan di lapisan web server Nginx tercepat.\n\n---\n\n## 1. Dua Zona Rate Limiting Terpisah (Dual-Zone Limiting)\n\nMeletakkan rate limit yang seragam di seluruh aplikasi adalah kesalahan fatal. Mengapa?\n- Membatasi 5 request\/menit untuk seluruh URL akan merusak halaman web normal yang memuat puluhan file CSS\/JS.\n- Mengizinkan 30 request\/detik untuk seluruh URL akan membuat form login rentan dibobol serangan *brute force*.\n\nKonfigurasi ini membaginya menjadi dua zona di dalam blok `http { ... }`:\n\n```nginx\n# 1. Zona Otentikasi: Sangat ketat (5 request per menit)\nlimit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r\/m;\n\n# 2. Zona Umum: Longgar untuk navigasi aplikasi normal (30 request per detik)\nlimit_req_zone $binary_remote_addr zone=general_limit:10m rate=30r\/s;\n```\n\n### Penerapan pada Lokasi URL:\n```nginx\n# Endpoint sensitif dibatasi oleh auth_limit dengan burst=5\nlocation ~* ^\/(login|register|forgot-password|reset-password|two-factor-challenge|livewire|oauth) {\n    limit_req zone=auth_limit burst=5 nodelay;\n    try_files $uri $uri\/ \/index.php?$query_string;\n}\n\n# Seluruh rute lain menggunakan general_limit dengan burst=50\nlocation \/ {\n    limit_req zone=general_limit burst=50 nodelay;\n    try_files $uri $uri\/ \/index.php?$query_string;\n}\n```\n\n---\n\n## 2. Pembebasan Aset Statis Frontend Vite (Asset Bypass)\n\n### Masalah `NS_ERROR_CORRUPTED_CONTENT`:\nAplikasi Laravel modern yang menggunakan **Vite** (React, Vue, Inertia, Livewire) memecah kode JavaScript menjadi puluhan chunk berkas kecil (`.js` dan `.css`). Ketika browser membuka halaman pertama kali, browser akan mengunduh 30–50 chunk secara paralel dalam milidetik yang sama.\n\nJika folder build terkena rate limiting, sebagian chunk akan ditolak dengan status HTTP 429 atau koneksi diputus paksa. Browser Firefox memunculkan error legendaris: `NS_ERROR_CORRUPTED_CONTENT`, dan tampilan aplikasi menjadi blank\/rusak!\n\n### Solusi Hardening:\n```nginx\nlocation ^~ \/build\/ {\n    # 1. WAJIB bebas dari direktif limit_req\n    # 2. Kembalikan 404 murni jika file tidak ada (jangan lempar ke PHP)\n    try_files $uri =404;\n\n    # 3. Cache permanen 1 tahun karena Vite menyematkan hash unik pada nama file\n    access_log off;\n    expires 1y;\n    add_header Cache-Control \"public, max-age=31536000, immutable\";\n}\n```\n\n---\n\n## 3. Strict Single-PHP Execution (Hanya `\/index.php`)\n\nMayoritas eksploitasi webshell bekerja dengan cara:\n1. Penyerang berhasil mengunggah skrip PHP ke folder `public\/uploads\/backdoor.php`.\n2. Penyerang mengakses `https:\/\/domain.com\/uploads\/backdoor.php` di browser.\n3. Nginx mencocokkan blok `location ~ \\.php$` dan meneruskannya ke PHP-FPM, sehingga kode berbahaya dieksekusi.\n\n### Proteksi Mutlak di Level Nginx:\nDalam aplikasi Laravel murni, **TIDAK ADA BERKAS PHP YANG BOLEH DIEKSEKUSI SELAIN `public\/index.php`**!\n\n```nginx\n# 1. BLOKIR KERAS seluruh percobaan eksekusi berkas .php di subfolder publik\nlocation ~* ^\/(?!index\\.php$).*\\.(php|phtml|php[34578]|phar|sh|pl|cgi|py)$ {\n    deny all;\n    return 403;\n}\n\n# 2. HANYA index.php yang diizinkan masuk ke PHP-FPM\nlocation = \/index.php {\n    include snippets\/fastcgi-php.conf;\n    fastcgi_pass unix:\/var\/run\/php\/php8.3-fpm.sock;\n    fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;\n    include fastcgi_params;\n}\n```\nDengan aturan ini, meskipun seorang penyerang berhasil meletakkan file backdoor di direktori mana pun di webroot, berkas tersebut **tidak akan pernah bisa dieksekusi oleh PHP-FPM** karena Nginx langsung menolaknya dengan HTTP 403!\n\n---\n\n## 4. Sandboxing Folder Storage & Upload\n\nFolder `storage\/app\/public` (atau link simbolik `\/storage\/` di webroot) adalah tempat berkas unggahan pengguna disimpan. Folder ini diisolasi penuh:\n\n```nginx\nlocation ^~ \/storage\/ {\n    # 1. Matikan eksekusi FastCGI secara mutlak\n    # 2. Berikan header isolasi keamanan browser\n    add_header X-Content-Type-Options \"nosniff\" always;\n    add_header Content-Security-Policy \"default-src 'none'; style-src 'unsafe-inline'; sandbox\" always;\n    \n    try_files $uri =404;\n}\n```\nHeader `nosniff` dan `CSP sandbox` memastikan bahwa jika seseorang mengunggah file gambar palsu yang berisi JavaScript atau HTML (SVG XSS), browser pengunjung tidak akan mengeksekusi script tersebut.\n\n---\n\n## 5. Blokir Ekstensi Ganda & Berkas Sensitif\n\n```nginx\n# Blokir double extension (misal: image.php.jpg atau dokumen.phtml.zip)\nlocation ~* \\.(php|phtml|phar)\\.[a-zA-Z0-9]+$ {\n    deny all;\n    return 403;\n}\n\n# Blokir berkas rahasia, cadangan database, dan dotfiles\nlocation ~* \\.(env|git|htaccess|sql|bak|log|ini|conf)$ {\n    deny all;\n    return 403;\n}\n```\r\n"},{"section":"06-webserver-hardening","filename":"02-apache-htaccess-hardening.md","title":"02. Hardening Apache Web Server (.htaccess)","content":"# 02. Hardening Apache Web Server (.htaccess)\r\n\r\nHalaman ini mendokumentasikan aturan keamanan berkas **`public\/.htaccess`** yang disediakan oleh **Laravel Security Monitor (Bulwark)** untuk server yang menggunakan **Apache HTTP Server**, **LiteSpeed**, atau lingkungan shared hosting seperti **cPanel**.\r\n\r\nAturan hardening ini dirancang untuk mencegah eksploitasi di tingkat web server sebelum permintaan diproses oleh PHP runtime, mencakup pencegahan eksekusi webshell, bypass ekstensi ganda, eksposur dotfile, hingga kebocoran berkas dump database.\r\n\r\n---\r\n\r\n## 1. Berkas Lengkap `public\/.htaccess` Hardened\r\n\r\nBerikut adalah konfigurasi lengkap berkas `.htaccess` yang dipublikasikan oleh paket:\r\n\r\n```apache\r\n<IfModule mod_rewrite.c>\r\n    <IfModule mod_negotiation.c>\r\n        Options -MultiViews -Indexes\r\n    <\/IfModule>\r\n\r\n    RewriteEngine On\r\n\r\n    # Handle Authorization Header\r\n    RewriteCond %{HTTP:Authorization} .\r\n    RewriteRule .* - [E=HTTP_AUTHORIZATION:%{HTTP:Authorization}]\r\n\r\n    # Handle X-XSRF-Token Header\r\n    RewriteCond %{HTTP:x-xsrf-token} .\r\n    RewriteRule .* - [E=HTTP_X_XSRF_TOKEN:%{HTTP:X-XSRF-Token}]\r\n\r\n    # Redirect Trailing Slashes If Not A Folder...\r\n    RewriteCond %{REQUEST_FILENAME} !-d\r\n    RewriteCond %{REQUEST_URI} (.+)\/$\r\n    RewriteRule ^ %1 [L,R=301]\r\n\r\n    # Send Requests To Front Controller...\r\n    RewriteCond %{REQUEST_FILENAME} !-d\r\n    RewriteCond %{REQUEST_FILENAME} !-f\r\n    RewriteRule ^ index.php [L]\r\n<\/IfModule>\r\n\r\n# ---------------------------------------------------------------------------\r\n# Hardening keamanan (lihat DOCS\/security-monitor.md)\r\n# Melindungi dari: upload webshell (wne.php%00.jpg), double extension\r\n# (shell.php.jpg), pembacaan .htaccess\/.env, dan eksposur berkas backup.\r\n# ---------------------------------------------------------------------------\r\n\r\n# Blokir akses ke dotfile (.htaccess, .env, .git, .htpasswd, ...)\r\n<FilesMatch \"^\\.\">\r\n    <IfModule mod_authz_core.c>\r\n        Require all denied\r\n    <\/IfModule>\r\n    <IfModule !mod_authz_core.c>\r\n        Order allow,deny\r\n        Deny from all\r\n    <\/IfModule>\r\n<\/FilesMatch>\r\n\r\n# Jangan pernah menyajikan berkas dengan double extension (shell.php.jpg)\r\n<FilesMatch \"\\.(php[0-9]?|phtml|pht|phar|phps|asp|aspx|ashx|asmx|jsp|jspx|cgi|pl|py|rb|sh|bash|exe|dll|bat|cmd|scr)\\.[a-z0-9]+$\">\r\n    <IfModule mod_authz_core.c>\r\n        Require all denied\r\n    <\/IfModule>\r\n    <IfModule !mod_authz_core.c>\r\n        Order allow,deny\r\n        Deny from all\r\n    <\/IfModule>\r\n<\/FilesMatch>\r\n\r\n# Blokir berkas backup \/ dump \/ log bila ikut tersalin ke folder publik\r\n<FilesMatch \"\\.(sql|bak|old|orig|save|swp|log|ini|conf|yml|yaml)$\">\r\n    <IfModule mod_authz_core.c>\r\n        Require all denied\r\n    <\/IfModule>\r\n    <IfModule !mod_authz_core.c>\r\n        Order allow,deny\r\n        Deny from all\r\n    <\/IfModule>\r\n<\/FilesMatch>\r\n\r\n# Matikan directory listing\r\nOptions -Indexes\r\n```\r\n\r\n---\r\n\r\n## 2. Bedah Aturan Keamanan (Line-by-Line Analysis)\r\n\r\n### A. Blokir Akses ke Dotfile (`^\\.`)\r\n```apache\r\n<FilesMatch \"^\\.\">\r\n    <IfModule mod_authz_core.c>\r\n        Require all denied\r\n    <\/IfModule>\r\n    <IfModule !mod_authz_core.c>\r\n        Order allow,deny\r\n        Deny from all\r\n    <\/IfModule>\r\n<\/FilesMatch>\r\n```\r\n- **Tujuan**: Mencegah browser atau penyerang mengunduh berkas tersembunyi yang diawali tanda titik (`.`).\r\n- **Ancaman yang Ditangkal**:\r\n  - Pembacaan konfigurasi sensitif `.env` jika document root salah diarahkan ke root proyek alih-alih `public\/`.\r\n  - Pembacaan berkas kontrol versi `.git\/config`, `.gitignore`, dan `.gitlab-ci.yml`.\r\n  - Pembacaan atau verifikasi keberadaan `.htaccess` dan `.htpasswd`.\r\n- **Kompatibilitas Ganda**: Menggunakan `mod_authz_core.c` (Apache 2.4+) dengan fallback ke `mod_access_compat` (Apache 2.2 \/ legacy LiteSpeed).\r\n\r\n### B. Proteksi Serangan Ekstensi Ganda (Double Extension Bypass)\r\n```apache\r\n<FilesMatch \"\\.(php[0-9]?|phtml|pht|phar|phps|asp|aspx|ashx|asmx|jsp|jspx|cgi|pl|py|rb|sh|bash|exe|dll|bat|cmd|scr)\\.[a-z0-9]+$\">\r\n    <IfModule mod_authz_core.c>\r\n        Require all denied\r\n    <\/IfModule>\r\n    <IfModule !mod_authz_core.c>\r\n        Order allow,deny\r\n        Deny from all\r\n    <\/IfModule>\r\n<\/FilesMatch>\r\n```\r\n- **Tujuan**: Memblokir berkas berbahaya yang disamarkan dengan ekstensi ganda, misalnya:\r\n  - `avatar.php.jpg` atau `document.phtml.png`\r\n  - Webshell polyglot atau trik null-byte (`wne.php%00.jpg`)\r\n  - Skrip executable Windows\/Linux (`payload.sh.txt`, `trojan.exe.pdf`)\r\n- **Mengapa ini Penting di Apache?**: Pada beberapa konfigurasi Apache dengan handler MIME ganda (`AddHandler` atau `SetHandler`), berkas bernama `shell.php.jpg` dapat dieksekusi oleh modul PHP karena mengandung substring `.php`. Aturan ini menjamin Apache langsung menolak permintaan dengan **HTTP 403 Forbidden**.\r\n\r\n### C. Blokir Berkas Backup, Dump Database, dan Log Sensitif\r\n```apache\r\n<FilesMatch \"\\.(sql|bak|old|orig|save|swp|log|ini|conf|yml|yaml)$\">\r\n    <IfModule mod_authz_core.c>\r\n        Require all denied\r\n    <\/IfModule>\r\n    <IfModule !mod_authz_core.c>\r\n        Order allow,deny\r\n        Deny from all\r\n    <\/IfModule>\r\n<\/FilesMatch>\r\n```\r\n- **Tujuan**: Mencegah kebocoran data (*data leakage*) jika developer atau skrip deployment tidak sengaja meninggalkan berkas backup di folder publik.\r\n- **Ekstensi yang Ditutup**:\r\n  - Database dump: `.sql`\r\n  - Backup teks\/editor: `.bak`, `.old`, `.orig`, `.save`, `.swp` (Vim swap file)\r\n  - Log server & aplikasi: `.log`\r\n  - Konfigurasi: `.ini`, `.conf`, `.yml`, `.yaml`\r\n\r\n### D. Menonaktifkan Directory Listing\r\n```apache\r\nOptions -Indexes\r\n```\r\n- **Tujuan**: Memastikan Apache tidak menampilkan daftar isi folder (*directory indexing*) jika folder tidak memiliki berkas `index.php` atau `index.html` (misalnya folder `public\/storage\/uploads\/`).\r\n- **Efek**: Pengunjung yang membuka direktori langsung akan menerima respons **HTTP 403 Forbidden** alih-alih melihat daftar berkas yang diunggah.\r\n\r\n---\r\n\r\n## 3. Cara Menerapkan ke Aplikasi Laravel Anda\r\n\r\n### Opsi 1: Otomatis via `security:install` (Direkomendasikan)\r\nSaat Anda menjalankan:\r\n```bash\r\nphp artisan security:install\r\n```\r\nPerintah ini akan mendeteksi keberadaan berkas `public\/.htaccess`:\r\n- Jika berkas sudah ada, installer akan membuat cadangan otomatis:\r\n  ```\r\n  public\/.htaccess.backup-20261002_010000\r\n  ```\r\n  dan menyisipkan blok hardening ke berkas yang ada tanpa menghapus aturan rewrite kustom Anda.\r\n- Jika ingin menimpa total dengan berkas bersih bawaan paket:\r\n  ```bash\r\n  php artisan security:install --force\r\n  ```\r\n\r\n### Opsi 2: Manual via Vendor Publish Tag\r\nAnda juga dapat mempublikasikannya langsung menggunakan tag Artisan Laravel:\r\n```bash\r\nphp artisan vendor:publish --tag=security-htaccess --force\r\n```\r\n\r\n---\r\n\r\n## 4. Verifikasi dan Pengujian\r\n\r\nSetelah berkas `.htaccess` diperbarui, Anda dapat menguji efektivitas aturan keamanan langsung menggunakan `curl`:\r\n\r\n### 1. Uji Blokir Dotfile (.env \/ .git)\r\n```bash\r\ncurl -I http:\/\/localhost:8000\/.env\r\n# Respons yang diharapkan: HTTP\/1.1 403 Forbidden\r\n```\r\n\r\n### 2. Uji Blokir Double Extension\r\n```bash\r\ncurl -I http:\/\/localhost:8000\/storage\/avatar.php.jpg\r\n# Respons yang diharapkan: HTTP\/1.1 403 Forbidden\r\n```\r\n\r\n### 3. Uji Blokir Berkas Backup \/ Dump SQL\r\n```bash\r\ncurl -I http:\/\/localhost:8000\/backup.sql\r\n# Respons yang diharapkan: HTTP\/1.1 403 Forbidden\r\n```\r\n\r\n### 4. Uji Matikan Directory Listing\r\n```bash\r\ncurl -I http:\/\/localhost:8000\/storage\/\r\n# Respons yang diharapkan: HTTP\/1.1 403 Forbidden\r\n```\r\n\r\n---\r\n\r\n## 5. Catatan Konfigurasi VirtualHost Apache\r\n\r\nPastikan virtual host Apache Anda telah mengizinkan override dari berkas `.htaccess` dengan direktif `AllowOverride All`:\r\n\r\n```apache\r\n<VirtualHost *:80>\r\n    ServerName example.com\r\n    DocumentRoot \/var\/www\/html\/example\/public\r\n\r\n    <Directory \/var\/www\/html\/example\/public>\r\n        Options -Indexes +FollowSymLinks\r\n        AllowOverride All\r\n        Require all granted\r\n    <\/Directory>\r\n\r\n    ErrorLog ${APACHE_LOG_DIR}\/example_error.log\r\n    CustomLog ${APACHE_LOG_DIR}\/example_access.log combined\r\n<\/VirtualHost>\r\n```\r\n\r\n> 💡 **LiteSpeed \/ OpenLiteSpeed**: LiteSpeed secara native mendukung sintaks `.htaccess` Apache dan akan langsung menerapkan aturan-aturan di atas saat berkas disimpan.\r\n"},{"section":"06-webserver-hardening","filename":"03-production-checklist.md","title":"02. Checklist Keamanan Produksi","content":"# 02. Checklist Keamanan Produksi\n\nGunakan daftar periksa (*checklist*) ini sebelum meluncurkan aplikasi ke lingkungan produksi untuk memastikan seluruh lapisan keamanan telah terpasang dengan benar.\n\n---\n\n## 1. Verifikasi Konfigurasi Lingkungan (`.env`)\n\n- [ ] `APP_DEBUG=false`: Wajib dimatikan agar pesan stack trace dan kredensial database tidak bocor saat terjadi error.\n- [ ] `APP_ENV=production`.\n- [ ] `SESSION_SECURE_COOKIE=true`: Memastikan cookie sesi hanya dikirim melalui koneksi terenkripsi HTTPS.\n- [ ] `SECURITY_MONITOR_ENABLED=true`: Sakelar WAF aktif.\n- [ ] `SECURITY_BLOCK_ENFORCEMENT=true`: Penolakan HTTP 403 aktif untuk IP yang terblokir.\n- [ ] `SECURITY_INSTANT_BLOCK_ENABLED=true`: Blokir langsung 30 hari untuk zero-tolerance attack.\n- [ ] `SECURITY_LOGIN_LOCKOUT_ENABLED=true`: Proteksi stepped brute force aktif.\n- [ ] `SECURITY_SUPPORT_EMAIL`: Diisi alamat email resmi helpdesk\/keamanan instansi Anda.\n\n---\n\n## 2. Integritas Berkas & Baseline\n\n- [ ] **Buat Baseline SHA-256 Pertama Kali**:\n  Segera setelah deployment rilis selesai dijalankan:\n  ```bash\n  php artisan security:baseline --force\n  ```\n  Ini mengunci hash berkas inti resmi (`app\/`, `config\/`, `routes\/`, `public\/index.php`, `bootstrap\/app.php`).\n\n---\n\n## 3. Hak Akses Berkas & Direktori (Permissions)\n\nTerapkan prinsip *Least Privilege* pada sistem operasi Linux:\n```bash\n# Berikan kepemilikan kepada pengguna web server\nsudo chown -R www-data:www-data \/var\/www\/aplikasi-anda\n\n# Setel izin direktori standar (755) dan berkas (644)\nfind \/var\/www\/aplikasi-anda -type d -exec chmod 755 {} \\;\nfind \/var\/www\/aplikasi-anda -type f -exec chmod 644 {} \\;\n\n# Folder storage dan cache WAJIB writable (775)\nchmod -R 775 \/var\/www\/aplikasi-anda\/storage\nchmod -R 775 \/var\/www\/aplikasi-anda\/bootstrap\/cache\n```\n\n---\n\n## 4. Crontab & Otomasi Pemeliharaan\n\n- [ ] Pastikan cron runner Laravel berjalan setiap menit:\n  ```bash\n  * * * * * cd \/var\/www\/aplikasi-anda && php artisan schedule:run >> \/dev\/null 2>&1\n  ```\n- [ ] Pastikan cron pembersih log usang harian aktif (`security:prune-logs` pada jam 02:30).\n\n---\n\n## 5. Web Server Nginx Hardening\n\n- [ ] Salin template `nginx.conf` yang telah dipublikasikan ke `\/etc\/nginx\/sites-available\/`.\n- [ ] Pastikan dua direktif `limit_req_zone` diletakkan di dalam blok `http { ... }`.\n- [ ] Jalankan uji sintaks Nginx:\n  ```bash\n  sudo nginx -t\n  ```\n- [ ] Reload Nginx:\n  ```bash\n  sudo systemctl reload nginx\n  ```\n\n---\n\n## 6. Prosedur Darurat Buka Blokir (Emergency Runbook)\n\nJika karena suatu insiden tak terduga, IP kantor pusat atau IP pimpinan terblokir oleh WAF:\n1. Hubungkan ke server melalui SSH.\n2. Jalankan perintah unblock instan:\n   ```bash\n   php artisan security:unblock-ip 103.11.22.33\n   ```\n   Atau jika darurat skala luas:\n   ```bash\n   php artisan security:unblock-ip --all\n   ```\n3. Tambahkan IP tersebut ke variabel `SECURITY_WHITELIST` di berkas `.env` agar tidak terulang kembali.\r\n"},{"section":"07-integration-guides","filename":"01-frontend-react-inertia.md","title":"01. Integrasi Frontend React \/ Inertia","content":"# 01. Integrasi Frontend React \/ Inertia\n\nKarena **`robyajo\/laravel-security-monitor`** dirancang secara **Headless (Pure REST API)**, Anda dapat membangun antarmuka dashboard keamanan dan penanganan error pemblokiran menggunakan React dan Inertia.js sesuai kebutuhan desain aplikasi Anda.\n\n---\n\n## 1. Menangani Respons HTTP 403 Terblokir (Axios Interceptor)\n\nKetika pengguna terblokir oleh WAF, setiap panggilan API atau request Inertia akan mengembalikan kode status **HTTP 403 Forbidden** dengan struktur JSON:\n\n```json\n{\n    \"success\": false,\n    \"message\": \"Akses ditolak. Alamat IP atau perangkat Anda diblokir...\",\n    \"reason\": \"Percobaan Server-Side Template Injection (SSTI)\",\n    \"reference_id\": \"SEC-A1B2C3D4\",\n    \"blocked\": true\n}\n```\n\nAnda dapat menangani respons ini secara global menggunakan Axios interceptor:\n\n```javascript\n\/\/ resources\/js\/lib\/axios.js\nimport axios from \"axios\";\n\nconst api = axios.create({\n    baseURL: \"\/api\",\n});\n\napi.interceptors.response.use(\n    (response) => response,\n    (error) => {\n        if (\n            error.response &&\n            error.response.status === 403 &&\n            error.response.data?.blocked\n        ) {\n            \/\/ Simpan detail blokir ke state manager \/ trigger modal permohonan banding\n            window.dispatchEvent(\n                new CustomEvent(\"security-blocked\", {\n                    detail: error.response.data,\n                }),\n            );\n        }\n        return Promise.reject(error);\n    },\n);\n\nexport default api;\n```\n\n---\n\n## 2. Komponen Modal Pengajuan Tiket Banding (Appeal Modal)\n\n```tsx\n\/\/ resources\/js\/Components\/AppealTicketModal.tsx\nimport React, { useState } from \"react\";\nimport axios from \"axios\";\n\ninterface BlockedData {\n    reference_id: string;\n    reason: string;\n    ip_address: string;\n}\n\nexport const AppealTicketModal: React.FC<{\n    data: BlockedData;\n    onClose: () => void;\n}> = ({ data, onClose }) => {\n    const [form, setForm] = useState({\n        name: \"\",\n        email: \"\",\n        phone: \"\",\n        reason: \"\",\n    });\n    const [ticketNumber, setTicketNumber] = useState<string | null>(null);\n    const [loading, setLoading] = useState(false);\n    const [errorMsg, setErrorMsg] = useState<string | null>(null);\n\n    const handleSubmit = async (e: React.FormEvent) => {\n        e.preventDefault();\n        setLoading(true);\n        setErrorMsg(null);\n\n        try {\n            const res = await axios.post(\n                \"\/api\/security\/unblock-tickets\/submit\",\n                {\n                    ...form,\n                    reason: `[Ref: ${data.reference_id}] ${form.reason}`,\n                },\n            );\n            setTicketNumber(res.data.ticket_number);\n        } catch (err: any) {\n            setErrorMsg(\n                err.response?.data?.message || \"Gagal mengirimkan permohonan.\",\n            );\n        } finally {\n            setLoading(false);\n        }\n    };\n\n    if (ticketNumber) {\n        return (\n            <div className=\"p-6 bg-white dark:bg-gray-900 rounded-lg shadow-xl max-w-md mx-auto text-center\">\n                <h3 className=\"text-xl font-bold text-green-600 mb-2\">\n                    Permohonan Berhasil Dikirim!\n                <\/h3>\n                <p className=\"text-sm text-gray-600 dark:text-gray-400 mb-4\">\n                    Nomor tiket permohonan banding Anda adalah:\n                <\/p>\n                <div className=\"p-3 bg-gray-100 dark:bg-gray-800 rounded font-mono font-bold text-lg select-all\">\n                    {ticketNumber}\n                <\/div>\n                <p className=\"text-xs text-gray-500 mt-4\">\n                    Simpan nomor ini untuk memeriksa status pembukaan blokir\n                    secara berkala.\n                <\/p>\n                <button\n                    onClick={onClose}\n                    className=\"mt-4 px-4 py-2 bg-blue-600 text-white rounded\"\n                >\n                    Tutup\n                <\/button>\n            <\/div>\n        );\n    }\n\n    return (\n        <form\n            onSubmit={handleSubmit}\n            className=\"p-6 bg-white dark:bg-gray-900 rounded-lg shadow-xl max-w-lg mx-auto space-y-4\"\n        >\n            <h2 className=\"text-lg font-bold text-red-600\">\n                Akses Dibatasi — Ajukan Permohonan Buka Blokir\n            <\/h2>\n            <p className=\"text-xs text-gray-500\">\n                ID Referensi: <strong>{data.reference_id}<\/strong> (IP:{\" \"}\n                {data.ip_address})\n            <\/p>\n\n            {errorMsg && (\n                <div className=\"p-2 bg-red-100 text-red-700 text-xs rounded\">\n                    {errorMsg}\n                <\/div>\n            )}\n\n            <div>\n                <label className=\"block text-xs font-medium\">\n                    Nama Lengkap\n                <\/label>\n                <input\n                    required\n                    type=\"text\"\n                    className=\"w-full border p-2 rounded text-sm\"\n                    value={form.name}\n                    onChange={(e) => setForm({ ...form, name: e.target.value })}\n                \/>\n            <\/div>\n            <div>\n                <label className=\"block text-xs font-medium\">\n                    Email Dinas \/ Aktif\n                <\/label>\n                <input\n                    required\n                    type=\"email\"\n                    className=\"w-full border p-2 rounded text-sm\"\n                    value={form.email}\n                    onChange={(e) =>\n                        setForm({ ...form, email: e.target.value })\n                    }\n                \/>\n            <\/div>\n            <div>\n                <label className=\"block text-xs font-medium\">\n                    Alasan \/ Klarifikasi Aktivitas\n                <\/label>\n                <textarea\n                    required\n                    rows={3}\n                    className=\"w-full border p-2 rounded text-sm\"\n                    value={form.reason}\n                    onChange={(e) =>\n                        setForm({ ...form, reason: e.target.value })\n                    }\n                    placeholder=\"Jelaskan aktivitas apa yang sedang Anda lakukan...\"\n                \/>\n            <\/div>\n            <button\n                type=\"submit\"\n                disabled={loading}\n                className=\"w-full py-2 bg-blue-600 text-white rounded font-medium hover:bg-blue-700 transition\"\n            >\n                {loading ? \"Mengirim...\" : \"Kirim Permohonan Banding\"}\n            <\/button>\n        <\/form>\n    );\n};\n```\n\n---\n\n## 3. Dashboard Monitoring React Starter Kit Siap Pakai\n\nJika aplikasi host Anda dibangun di atas **Laravel React Starter Kit** (Inertia + React + shadcn\/ui), Anda tidak perlu membangun panel monitoring dari nol. Paket menyediakan enam halaman Inertia\/React siap pakai yang dapat dipublikasikan dengan satu perintah:\n\n```bash\nphp artisan vendor:publish --tag=starterkit-react\n```\n\nPerintah tersebut menyalin berkas berikut ke aplikasi Anda:\n\n| Berkas yang Dipublikasikan                          | Deskripsi                                                   |\n| :-------------------------------------------------- | :---------------------------------------------------------- |\n| `resources\/js\/pages\/security\/overview.tsx`          | Statistik, tren serangan, dan top attacker.                 |\n| `resources\/js\/pages\/security\/logs.tsx`              | Tabel log keamanan dengan filter dan aksi bersihkan\/hapus.  |\n| `resources\/js\/pages\/security\/blocked-ips.tsx`       | Manajemen karantina IP (blokir manual, toggle, unblock).    |\n| `resources\/js\/pages\/security\/server.tsx`            | Audit integritas, pemindai webshell, baseline, dan lockout. |\n| `resources\/js\/pages\/security\/sessions.tsx`          | Sesi pengguna aktif, riwayat login, dan IP terpercaya.      |\n| `resources\/js\/pages\/security\/tickets.tsx`           | Review tiket banding (approve\/reject + auto-unblock).       |\n| `resources\/js\/components\/security\/security-nav.tsx` | Navigasi antar modul keamanan.                              |\n| `resources\/js\/components\/security\/pagination.tsx`   | Komponen paginasi tabel.                                    |\n\nAktifkan melalui `.env`, lalu bangun ulang aset:\n\n```dotenv\nSECURITY_DASHBOARD_ENABLED=true\nSECURITY_DASHBOARD_DRIVER=react\nSECURITY_DASHBOARD_PREFIX=security\n```\n\n```bash\nnpm run build\n```\n\nPanel dapat diakses pada `\/security`.\n\n> ℹ️ Halaman di-render **server-side** oleh controller Inertia bawaan paket (`Internal\\SecurityMonitor\\Http\\Controllers\\Dashboard\\*`). Mutasi (blokir IP, hapus log, approve tiket) dikirim sebagai permintaan Inertia biasa, sehingga **tidak** memerlukan token API terpisah dan tidak bergantung pada REST API `\/api\/security\/*`.\n\n> 🔒 **Wajib Login**: Rute dashboard memakai middleware `web` + `auth`, dan secara bawaan juga `security.admin` (Gate `manage-security-monitor`). Untuk mengizinkan semua pengguna yang sudah login (tanpa syarat admin), kosongkan `security.dashboard.admin_middleware` pada `config\/security.php`.\n\n### Menambahkan Tautan di Sidebar Starter Kit\n\nUntuk memunculkan tautan ke panel, tambahkan item berikut ke `mainNavItems` pada `resources\/js\/components\/app-sidebar.tsx`:\n\n```tsx\nimport { ShieldCheck } from 'lucide-react';\n\n{\n    title: 'Security Monitor',\n    href: '\/security',\n    icon: ShieldCheck,\n},\n```\n\n### Catatan\n\n- Jalankan `npm run build` (atau `npm run dev`) setiap kali halaman dashboard baru dipublikasikan agar tercatat pada manifest Vite.\n- Komponen `@\/components\/ui\/*` yang dipakai (button, badge, card, input, label) sudah tersedia bawaan pada React Starter Kit resmi.\n"},{"section":"07-integration-guides","filename":"02-frontend-blade-livewire.md","title":"02. Integrasi Frontend Blade & Livewire","content":"# 02. Integrasi Frontend Blade & Livewire\n\nJika aplikasi host Anda menggunakan template berbasis Blade atau Livewire, integrasi dengan **`robyajo\/laravel-security-monitor`** sangat cepat dan intuitif.\n\n---\n\n## 1. Menyesuaikan Halaman Tampilan Blokir (`errors.blocked`)\n\nJika request bukan panggilan JSON API, middleware `BlockIpAddress` secara otomatis memeriksa apakah berkas view Blade `errors.blocked` tersedia di aplikasi Anda (`resources\/views\/errors\/blocked.blade.php`).\n\nJika ada, paket akan me-render view tersebut dengan meneruskan variabel:\n\n- `$ip`: Alamat IP klien yang diblokir.\n- `$deviceId`: Fingerprint perangkat klien (jika ada).\n- `$localIp`: IP lokal klien.\n- `$reason`: Alasan pemblokiran (nama aturan atau catatan admin).\n- `$message`: Pesan deskriptif.\n- `$referenceId`: ID referensi unik (misal: `SEC-9A8B7C6D`).\n- `$supportEmail`: Alamat email bantuan dari konfigurasi.\n\n### Contoh Template Blade Cantik: `resources\/views\/errors\/blocked.blade.php`\n\n```blade\n<!DOCTYPE html>\n<html lang=\"id\">\n<head>\n    <meta charset=\"utf-8\">\n    <meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n    <title>403 - Akses Ditolak | Sistem Keamanan<\/title>\n    <style>\n        body { font-family: -apple-system, BlinkMacSystemFont, \"Segoe UI\", Roboto, sans-serif; background: #0f172a; color: #f8fafc; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; padding: 20px; box-sizing: border-box; }\n        .card { background: #1e293b; border: 1px solid #334155; border-radius: 12px; max-width: 520px; width: 100%; padding: 32px; box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5); }\n        .badge { display: inline-block; background: #ef4444; color: #fff; font-size: 12px; font-weight: bold; padding: 4px 10px; border-radius: 9999px; text-transform: uppercase; margin-bottom: 16px; }\n        h1 { font-size: 22px; margin: 0 0 12px 0; color: #f1f5f9; }\n        p { font-size: 14px; line-height: 1.6; color: #94a3b8; margin: 0 0 20px 0; }\n        .meta-box { background: #0f172a; border-radius: 8px; padding: 16px; margin-bottom: 24px; font-family: monospace; font-size: 13px; }\n        .meta-row { display: flex; justify-content: space-between; margin-bottom: 8px; }\n        .meta-row:last-child { margin-bottom: 0; }\n        .meta-label { color: #64748b; }\n        .meta-value { color: #38bdf8; font-weight: bold; }\n        .btn { display: block; width: 100%; text-align: center; background: #2563eb; color: #fff; text-decoration: none; padding: 12px; border-radius: 8px; font-weight: 600; font-size: 14px; transition: background 0.2s; }\n        .btn:hover { background: #1d4ed8; }\n        .footer { font-size: 12px; text-align: center; color: #64748b; margin-top: 20px; }\n    <\/style>\n<\/head>\n<body>\n    <div class=\"card\">\n        <span class=\"badge\">Akses Ditolak (403)<\/span>\n        <h1>Perlindungan Keamanan Aktif<\/h1>\n        <p>{{ $message }}<\/p>\n\n        <div class=\"meta-box\">\n            <div class=\"meta-row\">\n                <span class=\"meta-label\">ID Referensi:<\/span>\n                <span class=\"meta-value\">{{ $referenceId }}<\/span>\n            <\/div>\n            <div class=\"meta-row\">\n                <span class=\"meta-label\">Alamat IP:<\/span>\n                <span class=\"meta-value\">{{ $ip }}<\/span>\n            <\/div>\n            <div class=\"meta-row\">\n                <span class=\"meta-label\">Indikasi:<\/span>\n                <span class=\"meta-value\" style=\"color: #f87171\">{{ $reason }}<\/span>\n            <\/div>\n        <\/div>\n\n        <a href=\"mailto:{{ $supportEmail }}?subject=Buka%20Blokir%20{{ $referenceId }}\" class=\"btn\">\n            Hubungi Tim Keamanan IT\n        <\/a>\n\n        <div class=\"footer\">\n            Pusat Keamanan Siber &bullet; {{ config('app.name') }}\n        <\/div>\n    <\/div>\n<\/body>\n<\/html>\n```\n\n---\n\n## 2. Dashboard Monitoring Livewire Starter Kit Siap Pakai\n\nJika aplikasi host Anda dibangun di atas **Laravel Livewire Starter Kit** (Livewire + Flux UI), Anda tidak perlu membangun panel monitoring dari nol. Paket menyediakan enam halaman Livewire siap pakai yang dapat dipublikasikan dengan satu perintah:\n\n```bash\nphp artisan vendor:publish --tag=starterkit-livewire\n```\n\nPerintah tersebut menyalin berkas berikut ke aplikasi Anda:\n\n| Berkas yang Dipublikasikan                             | Deskripsi                                                   |\n| :----------------------------------------------------- | :---------------------------------------------------------- |\n| `resources\/views\/pages\/security\/overview.blade.php`    | Statistik, tren serangan, dan top attacker.                 |\n| `resources\/views\/pages\/security\/logs.blade.php`        | Tabel log keamanan dengan filter dan aksi bersihkan\/hapus.  |\n| `resources\/views\/pages\/security\/blocked-ips.blade.php` | Manajemen karantina IP (blokir manual, toggle, unblock).    |\n| `resources\/views\/pages\/security\/server.blade.php`      | Audit integritas, pemindai webshell, baseline, dan lockout. |\n| `resources\/views\/pages\/security\/sessions.blade.php`    | Sesi pengguna aktif, riwayat login, dan IP terpercaya.      |\n| `resources\/views\/pages\/security\/tickets.blade.php`     | Review tiket banding (approve\/reject + auto-unblock).       |\n| `resources\/views\/pages\/security\/layout.blade.php`      | Sub-layout navigasi antar modul keamanan.                   |\n\nSetelah dipublikasikan, aktifkan dashboard melalui `.env`:\n\n```dotenv\nSECURITY_DASHBOARD_ENABLED=true\nSECURITY_DASHBOARD_PREFIX=security\n```\n\nPanel dapat diakses pada `\/security`. Halaman-halaman tersebut merupakan **single-file Livewire component** (`pages::security.*`) sehingga otomatis memakai layout starter kit (`layouts::app`).\n\n> 🔒 **Wajib Login**: Rute dashboard memakai middleware `web` + `auth`, dan secara bawaan juga `security.admin` (Gate `manage-security-monitor`). Untuk mengizinkan semua pengguna yang sudah login (tanpa syarat admin), kosongkan `security.dashboard.admin_middleware` pada `config\/security.php`.\n\n### Menambahkan Tautan di Sidebar Starter Kit\n\nUntuk memunculkan tautan ke panel, tambahkan item berikut pada `resources\/views\/layouts\/app\/sidebar.blade.php` di dalam `<flux:sidebar.nav>`:\n\n```blade\n<flux:sidebar.item icon=\"shield-check\" :href=\"route('security.dashboard.overview')\" :current=\"request()->routeIs('security.dashboard.*')\" wire:navigate>\n    {{ __('Security Monitor') }}\n<\/flux:sidebar.item>\n```\n"},{"section":"07-integration-guides","filename":"03-custom-rules-and-whitelist.md","title":"03. Pembuatan Aturan Kustom & Whitelist Subnet","content":"# 03. Pembuatan Aturan Kustom & Whitelist Subnet\n\nSetiap aplikasi memiliki karakteristik lalu lintas data dan kebutuhan bisnis yang unik. Anda dapat memperluas aturan deteksi WAF bawaan dan mengonfigurasi pengecualian subnet (CIDR) secara fleksibel melalui `config\/security.php`.\n\n---\n\n## 1. Mendaftarkan Signature Zero-Tolerance Kustom\n\nJika aplikasi Anda memiliki endpoint khusus yang kerap diserang atau Anda ingin langsung memblokir percobaan pencarian berkas tertentu (misalnya probe terhadap `\/wp-login.php` atau `\/actuator\/health`), tambahkan ke array `instant_block.signatures` di `config\/security.php`:\n\n```php\n'instant_block' => [\n    'enabled' => true,\n    'duration_hours' => 720, \/\/ 30 hari\n    'signatures' => [\n        \/\/ Signature bawaan paket...\n\n        \/\/ Tambahkan aturan kustom Anda:\n        [\n            'id' => 'wordpress_probe_custom',\n            'label' => 'Percobaan probing CMS WordPress pada aplikasi non-WP',\n            'target' => 'path', \/\/ Hanya periksa URI path\n            'patterns' => [\n                '#^\/wp-(?:login|admin|content|includes)#i',\n                '#^\/xmlrpc\\.php#i',\n            ],\n        ],\n        [\n            'id' => 'spring_actuator_probe',\n            'label' => 'Percobaan akses Spring Boot Actuator',\n            'target' => 'path',\n            'patterns' => [\n                '#^\/actuator(?:\/.*)?$#i',\n            ],\n        ],\n    ],\n],\n```\n\n---\n\n## 2. Menambahkan Aturan WAF Reguler Kustom\n\nUntuk pola serangan yang ingin diakumulasikan ke dalam penilaian ambang batas bertingkat (auto-block 3 kali dalam 10 menit), tambahkan ke array `rules`:\n\n```php\n'rules' => [\n    \/\/ Aturan bawaan paket...\n\n    [\n        'id' => 'custom_log4j_jndi',\n        'label' => 'Indikasi Eksploitasi Log4j \/ JNDI Injection',\n        'level' => 'critical',\n        'patterns' => [\n            '\/\\$\\{jndi:(?:ldap|rmi|dns):\/i',\n        ],\n    ],\n],\n```\n\n---\n\n## 3. Whitelist Subnet Jaringan (CIDR) & Proxy Internal\n\nUntuk memastikan bahwa alamat IP jaringan kantor lokal, VPN kantor, atau subnet monitoring tidak akan pernah diblokir meskipun melakukan pengujian penetrasi:\n\n### Pada Berkas `.env`:\nPisahkan beberapa IP atau subnet dengan tanda koma:\n```dotenv\nSECURITY_WHITELIST=\"127.0.0.1,::1,192.168.1.0\/24,10.10.0.0\/16,103.11.22.33\"\n```\n\n### Logika Pemeriksaan Subnet:\nMetode `SecurityMonitorService::isWhitelisted()` secara otomatis mendukung:\n1. **Pencocokan Alamat IPv4 \/ IPv6 Tunggal**: (misal `127.0.0.1`, `::1`).\n2. **Pencocokan Notasi CIDR Subnet**: (misal `192.168.1.0\/24` atau `10.0.0.0\/8`).\n3. **Pencocokan Wildcard Sederhana**: (misal `192.168.*.*`).\n4. **Pengecekan Admin Bypass**: Pengguna yang terotentikasi sebagai administrator sistem secara otomatis memiliki hak bypass dan tidak akan pernah diblokir saat menguji sistem.\n\n---\n\n## 4. Pengecualian Jalur URI (`exclude_paths`)\n\nJika ada rute webhook pihak ketiga (seperti Midtrans, Xendit, Stripe, atau integrasi API mitra) yang mengirimkan payload terenkripsi mentah atau payload yang mirip pola teks tertentu, daftarkan jalurnya di `exclude_paths`:\n\n```php\n'exclude_paths' => [\n    'api\/webhooks\/*',\n    'api\/payment-callback\/*',\n    'livewire\/upload-file',\n],\n```\nRequest yang cocok dengan pola di atas akan dilewati dari inspeksi konten body WAF untuk mencegah kesalahan deteksi (*false positive*).\r\n"}];
        let currentIndex = 0;

        function sectionLabel(section) {
            return section.replace(/^\d+-/, '').replace(/-/g, ' ').toUpperCase();
        }

        function buildNav() {
            const nav = document.getElementById('navTree');
            nav.innerHTML = '';

            let currentSection = '';
            let list = null;

            docsData.forEach((doc, idx) => {
                if (doc.section !== currentSection) {
                    currentSection = doc.section;

                    const heading = document.createElement('div');
                    heading.className = 'mb-1 mt-4 px-2 text-[11px] font-extrabold uppercase tracking-wider text-slate-400';
                    heading.textContent = sectionLabel(currentSection);
                    nav.appendChild(heading);

                    list = document.createElement('ul');
                    list.className = 'space-y-0.5';
                    nav.appendChild(list);
                }

                const li = document.createElement('li');
                const a = document.createElement('a');
                a.className = 'nav-link block cursor-pointer truncate rounded-lg px-3 py-2 text-sm font-medium text-slate-500 transition hover:bg-slate-100 hover:text-slate-900 dark:text-slate-400 dark:hover:bg-slate-800 dark:hover:text-white';
                a.dataset.index = String(idx);
                a.textContent = doc.title;
                a.onclick = () => loadDoc(idx);
                li.appendChild(a);
                list.appendChild(li);
            });
        }

        function setActive(index) {
            document.querySelectorAll('.nav-link').forEach((el) => {
                const active = Number(el.dataset.index) === index;
                el.classList.toggle('bg-sky-400/10', active);
                el.classList.toggle('text-sky-600', active);
                el.classList.toggle('dark:text-sky-300', active);
                el.classList.toggle('font-bold', active);
            });
        }

        function renderMermaid(article) {
            article.querySelectorAll('pre > code.language-mermaid, pre > code.lang-mermaid').forEach((code) => {
                const div = document.createElement('div');
                div.className = 'mermaid not-prose my-6 flex justify-center';
                div.textContent = code.textContent;
                code.parentElement.replaceWith(div);
            });
        }

        function attachCopyButtons(article) {
            article.querySelectorAll('pre').forEach((pre) => {
                pre.classList.add('relative');

                const btn = document.createElement('button');
                btn.className = 'copy-btn absolute right-3 top-3 rounded-md border border-slate-700 bg-slate-800/80 px-2.5 py-1 text-[11px] font-semibold text-slate-300 transition hover:bg-sky-600 hover:text-white';
                btn.textContent = 'Salin';
                btn.onclick = () => {
                    const code = pre.querySelector('code') ? pre.querySelector('code').innerText : pre.innerText;
                    navigator.clipboard.writeText(code).then(() => {
                        btn.textContent = 'Tersalin! ✓';
                        setTimeout(() => { btn.textContent = 'Salin'; }, 1800);
                    });
                };

                pre.appendChild(btn);
            });
        }

        async function loadDoc(index) {
            const doc = docsData[index];
            if (!doc) { return; }

            currentIndex = index;
            setActive(index);
            document.getElementById('activeBreadcrumb').textContent = doc.title;

            const article = document.getElementById('articleContent');
            article.innerHTML = window.marked ? marked.parse(doc.content) : doc.content;

            renderMermaid(article);
            attachCopyButtons(article);

            if (window.mermaid) {
                try {
                    await mermaid.run({ nodes: article.querySelectorAll('.mermaid') });
                } catch (error) {
                    console.warn('Mermaid render skipped:', error);
                }
            }

            window.scrollTo({ top: 0, behavior: 'smooth' });
            closeSidebar();
        }

        function handleSearch(query) {
            const q = query.toLowerCase().trim();
            document.querySelectorAll('#navTree .nav-link').forEach((el) => {
                const match = el.textContent.toLowerCase().includes(q);
                el.parentElement.style.display = match ? '' : 'none';
            });
        }

        function toggleTheme() {
            const dark = document.documentElement.classList.toggle('dark');
            localStorage.setItem('bulwark-theme', dark ? 'dark' : 'light');

            if (window.mermaid) {
                mermaid.initialize({ startOnLoad: false, theme: dark ? 'dark' : 'default', securityLevel: 'loose' });
            }

            loadDoc(currentIndex);
        }

        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const backdrop = document.getElementById('backdrop');
            const hidden = sidebar.classList.toggle('-translate-x-full');
            backdrop.classList.toggle('hidden', hidden);
        }

        function closeSidebar() {
            if (window.innerWidth < 768) {
                document.getElementById('sidebar').classList.add('-translate-x-full');
                document.getElementById('backdrop').classList.add('hidden');
            }
        }

        (function initTheme() {
            const saved = localStorage.getItem('bulwark-theme');
            const dark = saved ? saved === 'dark' : true;
            document.documentElement.classList.toggle('dark', dark);
        })();

        if (window.mermaid) {
            mermaid.initialize({
                startOnLoad: false,
                securityLevel: 'loose',
                theme: document.documentElement.classList.contains('dark') ? 'dark' : 'default',
            });
        }

        buildNav();
        loadDoc(0);
    </script>
</body>
</html>
